global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'jenkins'
    static_configs:
      - targets: ['192.168.0.182:8080']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-prometheus-exporter:9113']
