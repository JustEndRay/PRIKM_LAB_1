version: '3.8'

services:
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    container_name: monitoring_prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    volumes:
      - prometheus_data:/prometheus

  node-exporter:
    image: prom/node-exporter
    container_name: monitoring_node_exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: monitoring_grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    volumes:
      - grafana_data:/var/lib/grafana

  nginx:
    image: prikm:latest
    container_name: lab4_nginx
    ports:
      - "8082:80"
    networks:
      - monitoring

  nginx-prometheus-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_prometheus_exporter
    ports:
      - "9113:9113"
    environment:
      - NGINX_STATUS_URL=http://nginx:80/metrics
    depends_on:
      - nginx
    networks:
      - monitoring

networks:
  monitoring:

volumes:
  prometheus_data:
  grafana_data:
